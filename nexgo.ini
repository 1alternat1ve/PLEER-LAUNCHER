; =====================================================================================
;  NEXGO - SETTINGS
; =====================================================================================
;  How to use:
;   - Change the number after the = sign and SAVE the file. The game reads it again within
;     a second (no restart needed). For the flashlight, switch it off and on once.
;   - Lines starting with ; are explanations only.
;   - If you get lost, delete a line: its default value is used again.
;   - Keys are written as codes (0x79 = F10). 0 disables a key.
;   - Most of this can be changed in the game: press - (minus) for the settings window.
;
;  CONTROLS
;   F10 = leave / enter the truck        Esc = back to the truck (or close the console)
;   W A S D = walk   Shift = sprint   Ctrl = crouch   Space = jump / climb
;   Q / E = lower / raise the eye   R = reset the eye height
;   Left click (hold) = zoom   Mouse wheel = walking speed   Middle click = reset speed
;   Right click = flashlight (night only)   G = change the beam size
;   ` (tilde) = open / close the console: walking keys are ignored while it is open
; =====================================================================================


[keys]
toggle = 0x79                     ; F10: leave the truck / return to it
menu = 0xBD                       ; - (minus): open the settings window (0 = off)
forward = 0x57                    ; W: walk forward
back = 0x53                       ; S: walk backward
left = 0x41                       ; A: step left
right = 0x44                      ; D: step right
sprint = 0x10                     ; Shift: sprint
crouch = 0x11                     ; Ctrl: crouch
jump = 0x20                       ; Space: jump / climb
eye_down = 0x51                   ; Q: lower the eye
eye_up = 0x45                     ; E: raise the eye
eye_reset = 0x52                  ; R: reset the eye height
building = 0x77                   ; F8: enter / leave a building (fade, then hop a short way straight ahead through the wall)
interact = 0x46                   ; F: the RP interaction prompt - near the truck's own door, enters the cabin
zoom = 0x01                       ; left mouse button (hold): zoom
speed_reset = 0x04                ; middle mouse button: reset the walking speed
flashlight = 0x02                 ; right mouse button: flashlight on / off while walking (0 = no flashlight)
flashlight_size = 0x47            ; G: cycle the beam size (narrow / medium / wide); 0 = none
console = 0xC0                    ; ` key: while the game console is open the walking keys are ignored; 0 = off

[walker]
language = -1                     ; menu language: -1 = Windows' own, 0 English, 1 Bahasa Melayu, 2 Deutsch, 3 Francais, 4 Espanol, 5 Portugues, 6 Polski, 7 Russian, 8 Italiano, 9 Nederlands, 10 Turkce, 11 Chinese, 12 Japanese, 13 Korean, 14 Thai, 15 Indonesia
walk_speed = 1.75                 ; normal walking speed (m/s)
sprint_multiplier = 2.6           ; sprint speed = walking speed x this
backward_speed_factor = 0.7       ; walking backwards is slower (0.7 = 70 %)
strafe_speed_factor = 0.9        ; sideways-only walking (90 %)
acceleration_time = 0.15          ; seconds to reach walking speed
run_acceleration = 1.6            ; how fast speed builds up towards sprinting (m/s2). Low = gradual, high = instant
run_deceleration = 4.0           ; how fast speed drops again when you slow down (m/s2)
deceleration_time = 0.1           ; seconds to stop
air_control = 0.25                ; steering in the air (0 = none, 1 = full)
speed_wheel_step = 0.12           ; each mouse wheel click changes the speed by this fraction
speed_scale_min = 0.25           ; slowest speed with the wheel (x walking speed)
speed_scale_max = 3.0            ; fastest speed with the wheel (x walking speed)
eye_height = 1.7                  ; eye height above the ground when standing (m)
crouch_eye_height = 1.00         ; eye height when crouching (m)
eye_adjust_speed = 0.8           ; how fast Q / E change the eye height
eye_adjust_min = -0.8            ; lowest the eye can go with Q (relative to standing)
eye_adjust_max = 0.5             ; highest the eye can go with E
jump_speed = 4.8                  ; jump strength (4.3 = about 0.9 m high)
gravity = 9.81                   ; gravity (leave as is)
max_climb_height = 1.3            ; obstacles up to this height can be climbed with Space
climb_duration = 0.55            ; seconds a climb takes
climb_slide_extra = 0.35          ; extra seconds gliding forward onto the top after a climb (more = slower glide)
high_jump_factor = 1.3            ; tap Space twice quickly for a higher jump: this much stronger (1 = off)
step_down_max = 0.6              ; a drop larger than this counts as a fall
ground_follow_time = 0.12        ; smoothing when following the ground / stairs
step_length = 0.93                ; length of one step (m)
head_bob_enabled = 1              ; 1 = the head dips with each step; 0 = off completely (walking and running), keeping the amounts below for later
bob_amount = 0.004                ; head dip per step (m). 0 = off
sway_amount = 0.003               ; sideways head sway while walking (m). 0 = off
run_stride_scale = 0.75           ; longer strides when running (0.5 = 50 % longer)
run_bob_scale = 0.6               ; extra head dip when running
run_sway_scale = 0.3              ; extra sideways sway when running
surge_amount = 0.014              ; head moves forward-back with each step when running (m)
idle_sway_amount = 0.008          ; weight shifting while standing still (m). 0 = static
breath_amount = 0.004             ; head movement from breathing while standing (m). 0 = off
landing_dip = 0.035               ; camera dip / shake when landing. Higher = more. 0 = off
zoom_factor = 0.62                ; zoom while the zoom key is held. Lower = closer (0.62 = medium, 0.4 = strong)
tired_shake = 0.3                 ; the view heaves and sways when out of breath after running. 0 = off, 2 = stronger
head_rotation_amount = 1          ; tiny head turns and nods (breathing, weight shifting, footsteps, landing). 0 = off, 2 = stronger
look_smoothing = 0.03             ; s: smooth mouse look - the plugin turns the head itself, with a little weight (bigger = heavier / softer); 0 = the game's own look
look_sensitivity = 0.5            ; smooth mouse look speed (1 = the same as the game's mouse sensitivity)
head_tracker = 1                  ; 1 = a head tracker (TrackIR, or opentrack speaking TrackIR) turns the view while walking too (the game only uses it in the cabin)
head_tracker_amount = 1.0        ; how much of the tracker's turn is used while walking
head_tracker_invert_yaw = 0      ; 1 = turn the other way round
head_tracker_invert_pitch = 0    ; 1 = up and down the other way round
head_tracker_roll = 0            ; 1 = the head's tilt too
game_tracker_hold = 1            ; 1 = the game's own head tracking eases off during the door animation; 0 = the game's head tracker is never touched (try 0 if the game or your tracker software misbehaves when closing)
mouse_smoothing = 0             ; EXPERIMENTAL: can make the view shake. 0 = off (recommended)
zoom_time = 0.15                  ; seconds the zoom takes to ease in / out
native_look = 1                  ; 1 = the game handles the mouse (recommended). Leave as is
mouse_sensitivity = 0.0018       ; only used when native_look = 0
invert_look_x = 0                 ; 1 = reverse left-right
invert_look_y = 0                 ; 1 = reverse up-down
spawn_door = 0                    ; 0 = driver's door (left or right, follows the truck), 1 = passenger door
spawn_facing = 1                  ; 1 = face the door, 0 = face along the truck
spawn_face_offset = -22           ; extra turn of the view in degrees. Negative = toward the front of the truck, positive = toward the rear
door_outward = 2.0               ; distance from the seat to where you appear (m)
fade_keep_window = 1             ; 1 = the transparent fade window stays shown after first use (avoids a small flicker)
door_hop_distance = 1.6           ; distance (m) the enter / leave building key hops straight ahead
interact_range = 1.2              ; metres from the truck's door within which the "[F] Enter cabin" prompt shows (you must also be roughly facing it)
cabin_exit_enabled = 1            ; 1 = while stopped and handbraked, shows an "[F] Exit" prompt (press F to start walking)
cabin_exit_require_look = 0       ; 0 = the prompt shows as soon as you are stopped and handbraked; 1 = you must also turn your head toward the door first (mouse look or a head tracker - a quick "peek" look control may not turn far enough)
show_prompts = 1                  ; 1 = the on-screen [F] prompts and hints; 0 = hidden (for realistic footage): the keys still work and the notices still show
show_hints = 1                    ; 1 = the guidance hints (what to do next, e.g. "Turn off the engine first"); 0 = hidden, the warnings still show
cabin_exit_yaw_threshold = 45     ; (only used when cabin_exit_require_look = 1) degrees you must turn your head toward the door before the prompt shows
cabin_exit_speed_threshold = 0.3 ; m/s: the truck must be slower than this (and handbrake on) for the prompt to be possible at all
far_ground_offset = 0             ; metres added to the estimated ground far from the truck (fields are often higher than the roads). Try 0.5 to 1.5 if you sink
far_ground = 1                    ; 1 = far from the truck (no ground collision) estimate the ground height from nearby map items (roads, paths)
second_focus = 1                ; 1 = while walking, also load the map's collision (roads, buildings) around you, not only around the truck (the game's own region query, run from the game thread)
stair_slope = 0.6               ; hold E while walking forward to climb like stairs (Q + forward goes down): metres of height per metre walked, so running climbs faster. 0 = off
stair_max_height = 12           ; the highest floor the climb reaches above the real ground (m)
stair_speed_factor = 0.85       ; walking speed while climbing / descending
suspend_on_free_camera = 1      ; 1 = when the game's own free camera (Numpad 0) is switched on, the plugin does nothing at all until you press F10 (so it never gets in the way of the fly mode)
door_shake_outside = 1            ; 1 = a small shake of the view when the door slams behind you as you leave the truck (the slam comes about 1.2 s after the door sound starts)
door_shake_outside_strength = 0.2 ; how strong that shake is (1 = the default thud, 0.5 = half, 2 = double)
door_shake_cabin = 1              ; 1 = a small shake of the cabin view when the door slams as you get back into the truck
door_shake_cabin_strength = 0.1   ; how strong that shake is (1 = the default thud, 0.5 = half, 2 = double)
door_animation = 1                ; 1 = getting out / in: turn to the door, a short blink at the door, the steps down / up (the camera never passes through the door); 0 = the fade
block_game_keys = 1               ; 1 = while walking, W A S D, Space, Q E R go only to the walker (the truck is not driven or steered by them; no need to rebind the game's keys); 0 = the game gets them too
door_step_time = 1.3             ; seconds for the steps down from / up to the cab door
free_camera_speed = 0             ; when you switch the game's free camera on (Numpad 0) its speed is set to this value (the game's own default is 100), whatever it was before; 0 = leave the speed as it is. Whatever you scroll while walking is always undone when the walk ends
esc_leaves_walk = 0           ; 0 = Esc opens the game's menu and your walk continues when you close it (F10 leaves the walk); 1 = Esc also ends the walk (the old behaviour)
focus_items = 1                 ; 1 = while walking, parked cars, props and furniture keep their collision around you (the game only keeps it within about 35 m of the truck); 0 = off
second_focus_interval = 1       ; seconds between those queries (the game queries around each vehicle every 1 to 1.5 s)
world_collision = 0               ; 1 = buildings, fences and poles from the game's map block you (boxes; a turned wall gets a slightly larger block)
hide_driver = 1                   ; 1 = hide the driver model in the cabin while you walk outside (found by its place at the seat)
fade_enabled = 1                  ; 1 = brief fade to black when leaving / entering the truck
fade_hold_min_ms = 900            ; when leaving the truck the screen stays black at least this many milliseconds after the walker is placed
fade_hold_max_ms = 3500           ; ... and up to this many milliseconds while the world around the walker is still loading (the fade-in starts as soon as the ground under the feet is known); 0 = fade in at once
footstep_sounds = 1               ; 1 = footsteps, door and flashlight click sounds
breath_sounds = 1                 ; 1 = breathing sounds (calm at rest, quick after running)
breath_volume = 0.45              ; breathing volume (0 to 1)
breath_sigh_min_run = 18          ; seconds of continuous running before the tired sigh after stopping

[collision]
radius = 0.40                    ; body width (m): how close the camera can get to a wall
step_height = 0.45               ; obstacles lower than this are stepped over
depenetration_speed = 1.5        ; speed of being pushed out of fixed geometry
depenetration_speed_moving = 30  ; cap of the push from moving vehicles

[light]
own = 1                           ; 0 = the flashlight only borrows street lamps (works at night only); 1 = by day, when no street lamp is on, the plugin makes a light of its own; 2 = always its own light
; The flashlight borrows one of the game's own street lights while you hold it, so it only works at night.
; After changing a value here, switch the flashlight off and on once.
angle = 28                        ; beam SIZE (degrees). Larger = wider. The size key also changes this
range = 40                        ; how FAR the light reaches (m)
brightness = 1                    ; multiplies the colour below (change overall brightness without shifting the colour tint)
r = 1                             ; COLOUR: red (0 to 3, above 1 = brighter)
g = 0.96                          ; COLOUR: green
b = 0.88                          ; COLOUR: blue (lower = yellower)
layers = 1                        ; lights stacked for a soft edge (1 = one light, hard edge; 3-4 = softer but heavier)
softness = 0.75                   ; edge softness (only when layers is above 1)
inner_angle = 12                  ; inner (sharp) part of the beam, degrees, so the shape stays the same regardless of which real light is borrowed. 0 = leave the light's own (can vary a lot, e.g. a wide floodlight vs. a narrow street lamp)
fade_time = 0.18                  ; seconds the beam takes to fade in / out
hand_right = 0.5                  ; hand position: right of the eye (m)
hand_down = 0.21                  ; hand position: below the eye (m)
hands = 1                         ; 1 = a hand holds the flashlight on the screen (the left hand while the right one holds the nozzle, card or receipt); 0 = no hand
borrow_min_distance = 300        ; street lights nearer than this are not borrowed (so none near you goes dark)
borrow_max_distance = 900        ; prefer lights nearer than this
set_colour = 1                   ; leave as is
set_range = 1                    ; leave as is
set_angle = 1                    ; leave as is
refresh_entry = 1                ; leave as is
forward = 0                      ; leave as is

[shadow]
enabled = 1                       ; 1 = a soft oval shadow on the ground under the walker. It is drawn through the Present hook, so use_present_hook must be 1 in [debug]
strength = 0.8                    ; darkness of the shadow (0 to 1)
softness = 4                      ; edge softness (bigger = softer)
size = 1.4                        ; radius of the shadow (1 = about a person's footprint)
length = 1                        ; how much longer than wide it gets as the sun's height gives it
feet_offset = -0.8                ; metres the shadow sits ahead (+) or behind (-) the point under the camera, along the view direction: use it to bring it nearer the bottom of the screen
min_length = 0                    ; it is never shorter (length to width) than this (0 = stays round even under a low sun)
contact = 0.1                     ; how much of the middle stays fully solid (0 = only the blurred edge, 1 = almost the whole oval)
azimuth_offset = 0                ; degrees added to the sun's compass direction: turn the shadow if it points the wrong way
azimuth_mirror = 1                ; 1 = turn the sun's compass direction the other way round
truck_fade = 2                    ; metres from the truck within which the shadow fades out; avoids it showing through the truck's own grille or bumper up close. 0 = off

[debug]
census_key = 0x77                ; F8: log every camera slot; Ctrl+F8: log the game's lights; Alt+F8: log the map sectors and their collision trees
dump_key = 0x77                  ; Shift+F8: log collision info (for bug reports)
physx_watch = 0                 ; 1 = log who adds and removes physics actors (diagnostic only, leave at 0)
camera_watch = 0                ; 1 = log which fields of the active in-cabin camera change while you look around (diagnostic only, leave at 0 - it is noisy since that camera is active almost all the time while driving)
use_present_hook = 1             ; 1 = the shadow and the on-screen "[F]" prompts need this (hooks the game's own Present); 0 = only the plain black-window fade, no shadow/prompts
menu_in_game = 1                 ; 1 = the settings menu (-) is drawn inside the game picture (needs use_present_hook = 1, falls back to a normal window if the hook is not running); 0 = always an ordinary window
allow_unverified_build = 0       ; 1 = keep flashlight and zoom on after a game update (may crash)




[fuel]
hand_light_scene = 1             
; Fuelling on foot: stop the truck in the game's fuel marker with the engine off, then get out (F10).
enabled = 1                       ; 1 = the pump / nozzle / tank interaction is on
card_step = 1                     ; 1 = [F] Pay with card at the pump before the nozzle can be taken; 0 = skip the card
hand_lighting = 2                ; the torch hands' light: 2 = looks round (lit from above and by the spot the torch lights), 1 = no relief, 0 = flat (lightest on a slow PC)
receipt = 1                       ; 1 = a receipt comes out of the pump after you hang up the nozzle ([F] Take receipt); 0 = no receipt
adblue = 1                        ; 1 = AdBlue (DEF in ATS): after the diesel nozzle is hung up the pump asks - F takes the blue nozzle and puts in the AdBlue the game added with the diesel (the game ties AdBlue to the diesel level), holding F prints the receipt; 0 = off
adblue_price = 0.70               ; AdBlue price per litre in ETS2 (euro): shown on the receipt, taken out of the total the game charged
def_price = 3.60                  ; DEF price per gallon in ATS (dollar)
adblue_ratio = 0.05               ; only when the game reports no AdBlue: litres of AdBlue used per litre of diesel burnt
adblue_capacity = 80              ; only when the game reports no AdBlue: the AdBlue tank size (litres)
adblue_flow = 0.6                 ; litres per second from the AdBlue nozzle
adblue_min = 1.0                  ; litres: the blue nozzle is offered when the game added at least this much AdBlue (DEF) with the diesel (about 20 L of diesel); smaller top-ups go on the receipt as diesel
use_enter = 1                     ; 1 = [F] Fuel holds the game's Enter key while the tank fills (the game fills only while Enter is held)
hands = 1                         ; 1 = the hands (nozzle, card, receipt) are drawn while fuelling; 0 = no hands
remember_tank = 1                 ; 1 = the place where you start fuelling is remembered for each truck model (in %APPDATA%\TMRealWalk\tanks.ini) and [F] Fuel follows it
forget_tanks = 0                  ; set to 1 (and save) to forget every remembered tank; it goes back to 0 by itself
truck_radius = 9                  ; m from the truck where the pump prompts work at all
pump_out = 4.5                    ; m from the truck's centre line, on the door side, where the pump island is
pump_back = 2.5                   ; m behind the driver's seat of that pump point
pump_radius = 4                   ; m around the pump point where you can pay, take and hang up the nozzle
tank_out = 1.4                    ; m from the truck's centre line to each fuel tank (a tank on both sides)
tank_back = 1.5                   ; m behind the driver's seat, where the tanks are
tank_radius = 1.3                 ; m around a tank where [F] Fuel shows
tank_length = 1.8                 ; m: how far along the truck the tank (and its cap) may be, around tank_back; [F] Fuel shows anywhere along it
learned_length = 0.4              ; m: once a truck's cap place is learned (remember_tank), [F] Fuel shows only within this stretch along the truck ...
learned_radius = 1.1              ; m: ... and this reach around it

[trailer]
; Beta 4 experiment: walking up to the trailer to couple / uncouple it.
enabled = 1                       ; 1 = at the truck's fifth wheel [F] Couple / Uncouple trailer (the plugin presses the game's attach key for you)
radius = 2.5                      ; m from the fifth wheel where the prompt shows
steps = 1                         ; 1 = uncoupling is a routine: [F] lower the landing gear (beside the trailer), [F] unplug the air hoses, [F] release the fifth wheel; 0 = one [F]
couple_steps = 1                  ; 1 = coupling is a routine too: [F] lock the fifth wheel, [F] connect the air hoses and cable, [F] raise the landing gear; 0 = one [F]
tug_test = 1                      ; 1 = after coupling, pull forward a little with the handbrake off (the tug test) before the air hoses can be connected; 0 = no tug test
couple_auto = 1                   ; 1 = backing under the trailer in the cabin locks the fifth wheel by itself (like a real one): the plugin presses the attach key when the kingpin is seated; 0 = press the game's attach key yourself, or [F] outside
game_sounds = 1                   ; 1 = the routine plays the game's own coupling sounds (landing gear, fifth wheel release) where it can; 0 = only the plugin's own sounds
body_motion = 1                   ; 1 = the body does the work at each trailer step: bends to the crank, leans in to the hoses, tugs the pin, squats to a chock
hands = 0                         ; 1 = a hand is shown at the landing gear crank, the air hoses and the fifth wheel pin; 0 = no hand
pin_game_sound = 0                ; 1 = the pin step plays the game's own attach / detach sound (long: air first, steel at the end); 0 = a short steel clank of the plugin
test_key_sound = 0              ; test only (0 = off): while walking, plays the game's own coupling sounds one by one
test_key_cable_off = 0          ; test only (0 = off): while walking, takes the truck's cables away without uncoupling
test_key_cable_on = 0           ; test only (0 = off): while walking, builds the cables again
legs_back = 2                     ; m behind the kingpin, along the trailer, where the landing gear is (a leg on each side)
legs_out = 1.1                    ; m out from the trailer's centre line to each leg
legs_radius = 1.8                 ; m around a leg where the landing gear prompt shows
hidden_legs_speed = 3             ; speed of the landing gear animations nobody should have to watch (the game's own is 0.333, about 3 s); higher = shorter
couple_range = 0.35               ; m: [F] Couple shows when the trailer's kingpin is this close to the fifth wheel (back the truck firmly onto the trailer first)
attach_key = 0x54                 ; the key of the game's own 'attach / detach trailer' (0x54 = T; change it if you moved it in the game's controls)
test_key = 0                     ; test only (0 = off): while walking, starts the trailer's legs animation DOWN and logs the game's trailer objects
test_key_up = 0                  ; test only (0 = off): while walking, starts the trailer's legs animation UP

[knock]
; Being hit by a moving vehicle (traffic, or any vehicle moving faster than min_speed): you are thrown, fall, lie on the
; ground for a while (a hard hit makes you pass out), get up, and stay dizzy for a few seconds.
enabled = 1                       ; 1 = a moving vehicle that runs into you knocks you over; 0 = it only pushes you aside
min_speed = 2.5                   ; m/s (2.5 = 9 km/h): slower vehicles only push you aside
throw = 0.55                      ; how much of the vehicle's speed goes into the throw (bigger = thrown further)
max_throw = 11.0                 ; m/s: the throw is never faster than this
down_time = 3.5                   ; seconds lying on the ground after a light hit (a hard hit adds up to 4 s more)
blackout_speed = 13.9             ; m/s (13.9 = 50 km/h): at this speed or faster you pass out for a moment
daze_time = 10                    ; seconds of dizziness (slow, unsteady, blurred) after getting up; 0 = none
tumble = 1                        ; how much the view spins and tilts in the fall (0 = no tilt, 2 = double)
screen_effects = 1                ; 1 = flash, blur, double vision and dark edges (needs [debug] use_present_hook = 1)
volume = 0.9                      ; impact, fall, heartbeat and ear-ringing sounds (0 = silent)
fall_height = 4                   ; m: a fall from higher than this also knocks you down (0 = off)
traffic_warning = 1               ; 1 = a fast vehicle heading at you sounds its horn, and one passing close by rushes past
